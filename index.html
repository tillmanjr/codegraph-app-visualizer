<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeGraph Dependency Explorer</title>
    <script src="cytoscape.min.js"></script>
    <script src="cytoscape-dagre.js"></script>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --sidebar-bg: #252538;
            --text-color: #cdd6f4;
            --accent-color: #89b4fa;
            --border-color: #45475a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; display: flex; height: 100vh;
        }
        #sidebar {
            width: 320px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;
            z-index: 10; overflow-y: auto;
        }
        h3 { margin: 0; color: var(--accent-color); font-size: 1.2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .stats-box { background-color: var(--bg-color); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.85rem; line-height: 1.5; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .input-row { display: flex; gap: 6px; }
        .input-row input { flex-grow: 1; }
        .slider-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #a6adc8; }
        label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #a6adc8; font-weight: bold; }
        select, input { background-color: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; outline: none; font-size: 0.85rem; }
        input[type="range"] { padding: 0; cursor: pointer; accent-color: var(--accent-color); }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; text-transform: none; font-weight: normal; color: var(--text-color); }
        button { background-color: var(--accent-color); color: #11111b; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-secondary { background-color: #45475a; color: var(--text-color); }
        .exclusion-list { max-height: 110px; overflow-y: auto; border: 1px solid var(--border-color); background: #11111b; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
        .exclusion-tag { display: flex; justify-content: space-between; align-items: center; background: #313244; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        .remove-btn { color: #f38ba8; cursor: pointer; font-weight: bold; padding-left: 6px; font-size: 0.85rem; }
        .info-panel { background-color: #11111b; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.85rem; word-break: break-all; min-height: 80px; line-height: 1.5; }
        #layout-warning { background-color: #f38ba8; color: #11111b; padding: 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; display: none; line-height: 1.4; text-align: center; }
        #cy-wrapper { flex-grow: 1; height: 100%; position: relative; }
        #cy { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #status-overlay { position: absolute; top: 15px; left: 15px; background: rgba(17, 17, 27, 0.9); padding: 10px 15px; border-radius: 6px; border: 1px solid var(--border-color); z-index: 100; font-size: 13px; color: #a6e3a1; pointer-events: none; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>CodeGraph Explorer</h3>
        <div class="stats-box">
            <div><strong>Active Nodes:</strong> <span id="n-count">0</span></div>
            <div><strong>Active Edges:</strong> <span id="e-count">0</span></div>
        </div>

        <div class="control-group">
            <label>Filter Elements</label>
            <label class="checkbox-label">
                <input type="checkbox" id="filter-variables" checked> Show Variables & Constants
            </label>
        </div>

        <div class="control-group">
            <label>Path Omission Exclusions</label>
            <div class="input-row">
                <input type="text" id="exclude-input" placeholder="e.g. test, mock, internal">
                <button id="btn-add-exclude">Add</button>
            </div>
            <div class="exclusion-list" id="exclusion-container"></div>
            <button id="btn-clear-exclude" class="btn-secondary" style="margin-top: 4px; padding: 4px 8px; font-size: 0.75rem;">Clear All</button>
        </div>

        <div class="control-group">
            <label>Graph Spacing Controls</label>
            <div class="slider-row">
                <span>Horizontal Spacing:</span>
                <span id="val-rank">200</span>
            </div>
            <input type="range" id="slide-rank" min="50" max="600" value="200">

            <div class="slider-row" style="margin-top: 5px;">
                <span>Vertical Spacing:</span>
                <span id="val-node">80</span>
            </div>
            <input type="range" id="slide-node" min="20" max="300" value="80">
        </div>

        <div class="control-group">
            <label>Search Nodes</label>
            <input type="text" id="search-input" placeholder="Type module or function name...">
        </div>

        <div class="control-group">
            <label>Navigation Controls</label>
            <button id="btn-fit">Center & Fit View</button>
        </div>

        <div class="control-group">
            <label for="layout-select">Layout Engine</label>
            <select id="layout-select">
                <option value="dagre">Dagre (Hierarchical)</option>
                <option value="cose">COSE (Force-Directed)</option>
                <option value="grid">Grid (Performance)</option>
            </select>
            <div id="layout-warning">⚠️ Large dataset warning!</div>
        </div>

        <div class="control-group">
            <label>Component Legend</label>
            <div class="legend">
                <div class="legend-item"><div class="legend-color" style="background: #a6e3a1;"></div> Function / Method</div>
                <div class="legend-item"><div class="legend-color" style="background: #fab387;"></div> Class / Interface</div>
                <div class="legend-item"><div class="legend-color" style="background: #89b4fa;"></div> File / Module</div>
                <div class="legend-item"><div class="legend-color" style="background: #f9e2af;"></div> Variable / Constant</div>
                <div class="legend-item"><div class="legend-color" style="background: #94e2d5;"></div> Generic Block</div>
            </div>
        </div>

        <div class="control-group">
            <label>Selected Element</label>
            <div id="info-box" class="info-panel">Click a node to inspect dependencies...</div>
        </div>
    </div>
    <div id="cy-wrapper">
        <div id="status-overlay">Initializing Engine...</div>
        <div id="cy"></div>
    </div>
    <script src="app-visualizer.js"></script>
</body>
</html>
